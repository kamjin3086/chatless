name: CI

# A ref that has moved does not need the run already in flight on it. What a stack of
# small commits costs is queue time, and only the newest commit on the ref is the
# thing anyone is asking about.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI runs once per pull request and on demand. There is deliberately no `push`
# trigger: main only ever moves by merging a pull request, and that merge push
# used to replay the exact same checks the PR had just run - every merge bought
# two full runs for one change. If a direct-push safety net is ever wanted,
# main should get branch protection requiring a PR instead.
on:
  pull_request:
    branches: [ main ]
    # Prose is not compiled, so it does not get a build. `**` takes everything in and
    # the `!` patterns take the noise back out; order is load-bearing, which is why the
    # re-included docs come after `!**.md`.
    #
    # Two docs are re-included on purpose, because `pnpm test` reads them and would
    # otherwise go red on main with no run to point at: docs/prompt-language.md carries
    # the sizing divisor asserted by docs/acceptance/prompt-budget.audit.test.ts, and
    # docs/agents/maintenance.md carries the gate claims asserted by
    # scripts/__tests__/vitestInventory.test.mjs. Everything else under
    # docs/acceptance/ is matched by `**` and stays in: the normal suite collects every
    # audit there.
    #
    # A filtered-out run is not a pass and not a pending check either - the workflow
    # does not run at all. Safe while main has no branch protection; if required status
    # checks are ever added, a prose-only pull request would sit at "Pending" forever,
    # so revisit this filter then. The pull request title gate lives in pr-title.yml
    # precisely so that filtering cannot switch it off.
    paths:
      - '**'
      - '!**.md'
      - '!LICENSE'
      - '!.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/**'
      - 'docs/prompt-language.md'
      - 'docs/agents/maintenance.md'
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Select test type. "basic" for fast checks, "full" for all, "tauri-only" for build tests.'
        required: true
        default: 'basic'
        type: choice
        options:
        - basic
        - full
        - tauri-only
      platforms:
        description: 'Select platforms to build (only for "full" or "tauri-only" types).'
        required: false
        type: choice
        default: 'all'
        options:
        - all
        - ubuntu
        - windows
        - macos
        - ubuntu-windows
        - ubuntu-macos
        - windows-macos
      upload_artifacts:
        description: 'Upload build artifacts (consumes storage space).'
        required: false
        type: boolean
        default: false

jobs:
  # 作业1：前端快速检查
  frontend-checks:
    if: github.event_name != 'workflow_dispatch' || (github.event.inputs.test_type == 'basic' || github.event.inputs.test_type == 'full')
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.15.4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run linting
        run: pnpm lint:ci
      - name: Type check
        run: pnpm typecheck
      - name: Type check the tests
        run: pnpm typecheck:tests
      - name: Run unit tests
        run: pnpm test

  # 作业2：后端快速检查 (cargo check)
  backend-check:
    if: github.event_name != 'workflow_dispatch' || (github.event.inputs.test_type == 'basic' || github.event.inputs.test_type == 'full')
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          # The free plan's Actions storage is 0.5 GB and this repo's caches
          # used to pile up past it, at which point GitHub silently refuses
          # every new cache write. Once usage crosses the threshold on a cache
          # hit, stale caches get pruned automatically.
          cleanup-on-hit: true
          cleanup-on-hit-threshold-percentage: 70
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf
      - name: Provide frontend placeholder
        # tauri::generate_context! embeds the frontendDist directory while
        # compiling, so cargo check only needs that path to exist. The real
        # frontend build runs in the frontend-checks job and on release.
        run: |
          mkdir -p dist
          printf '<!doctype html><meta charset="utf-8"><title>chatless</title>' > dist/index.html
      - name: Run cargo check
        run: cd src-tauri && cargo check

  # --- 手动触发的完整构建测试 ---

  test-tauri-ubuntu:
    needs: [frontend-checks, backend-check]
    # if: >-
    #   always() &&
    #   github.event_name == 'workflow_dispatch' &&
    #   (github.event.inputs.test_type == 'tauri-only' || github.event.inputs.test_type == 'full') &&
    #   (contains(github.event.inputs.platforms, 'all') || contains(github.event.inputs.platforms, 'ubuntu'))
    if: false  # ✅ 暂时禁用，后续可恢复上面的 if 条件
    runs-on: ubuntu-22.04
    container: ubuntu:22.04
    steps:
      - name: Prepare base tools in container
        run: apt-get update && apt-get install -y git ca-certificates curl xz-utils
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Rust system dependencies (Ubuntu 22.04)
        run: |
          apt-get update && apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev build-essential curl wget file patchelf libssl-dev
      - name: Build Tauri app (Debug)
        run: pnpm tauri build --debug
      - name: Upload build artifacts (if requested)
        if: ${{ github.event.inputs.upload_artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: chatless-debug-ubuntu
          path: src-tauri/target/debug/bundle/

  test-tauri-windows:
    needs: [frontend-checks, backend-check]
    # if: >-
    #   always() &&
    #   github.event_name == 'workflow_dispatch' &&
    #   (github.event.inputs.test_type == 'tauri-only' || github.event.inputs.test_type == 'full') &&
    #   (contains(github.event.inputs.platforms, 'all') || contains(github.event.inputs.platforms, 'windows'))
    if: false  # ✅ 暂时禁用，后续可恢复上面的 if 条件
    runs-on: windows-2019
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Tauri app (Debug)
        run: pnpm tauri build --debug
      - name: Upload build artifacts (if requested)
        if: ${{ github.event.inputs.upload_artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: chatless-debug-windows
          path: src-tauri/target/debug/bundle/

  test-tauri-macos:
    needs: [frontend-checks, backend-check]
    # if: >-
    #   always() &&
    #   github.event_name == 'workflow_dispatch' &&
    #   (github.event.inputs.test_type == 'tauri-only' || github.event.inputs.test_type == 'full') &&
    #   (contains(github.event.inputs.platforms, 'all') || contains(github.event.inputs.platforms, 'macos'))
    if: false  # ✅ 暂时禁用，后续可恢复上面的 if 条件
    runs-on: macos-12
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Tauri app (Debug)
        run: pnpm tauri build --debug
      - name: Upload build artifacts (if requested)
        if: ${{ github.event.inputs.upload_artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: chatless-debug-macos
          path: src-tauri/target/debug/bundle/
